<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>异涌｜官方资料</title>
  <meta name="description" content="《异涌》官方资料与隐私政策。">
  <style>
    :root { color-scheme: dark; --bg:#11100f; --card:#1c1a17; --text:#f7ead2; --muted:#baa98d; --accent:#c92b20; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:radial-gradient(circle at 70% 15%,#382319 0,transparent 34%),var(--bg); color:var(--text); }
    main { width:min(680px,calc(100% - 32px)); padding:48px; border:1px solid #43372c; border-radius:24px; background:linear-gradient(145deg,#201d19,#171512); box-shadow:0 24px 80px #0008; }
    h1 { margin:0 0 8px; font-size:clamp(42px,8vw,76px); letter-spacing:.08em; color:#e33a2d; }
    p { color:var(--muted); line-height:1.8; }
    a { display:inline-flex; margin-top:20px; padding:13px 20px; border-radius:12px; color:white; background:var(--accent); text-decoration:none; font-weight:700; }
    a:focus-visible { outline:3px solid #ffd27a; outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <h1>异涌</h1>
    <p>俯视角动作生存游戏。这里提供《异涌》的官方资料与隐私说明。</p>
    <a href="./privacy/">查看隐私政策</a>
  </main>
</body>
</html>
